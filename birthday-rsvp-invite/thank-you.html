<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanks for your RSVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="invite-hero thank-you" aria-labelledby="thanks-title">
        <div class="hero-art" aria-hidden="true">
          <span class="balloon balloon-one"></span>
          <span class="balloon balloon-two"></span>
          <span class="balloon balloon-three"></span>
          <span class="confetti confetti-one"></span>
          <span class="confetti confetti-two"></span>
          <span class="confetti confetti-three"></span>
        </div>
        <div class="hero-copy">
          <p class="eyebrow">RSVP received</p>
          <h1 id="thanks-title">Thank you!</h1>
          <p class="lede">Your response has been sent. We are looking forward to celebrating together.</p>
          <div class="hero-actions">
            <a class="button primary" href="index.html">Back to invitation</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
